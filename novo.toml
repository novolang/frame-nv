[package]
name        = "frame-nv"
version     = "0.1.5"
description = "A framed packet for a byte stream that has no message boundaries: a varint length prefix, the payload, a CRC-32C trailer over both, and the whole thing COBS-encoded so a zero byte can end the frame.  Ships a streaming reader that takes bytes as they arrive and answers whole frames, and reports a corrupt one as a positioned value."
license     = "Apache-2.0"
stability   = "experimental"
category    = "encoding"
layer       = "core"
tags        = ["framing", "cobs", "crc32c", "serial", "protocol"]
repository  = "https://github.com/novolang/frame-nv"
maintainers = ["novo-lang"]
main        = "src/main.nv"

# The README is the package's one page.  Its own first heading is the
# package name, which says nothing in a list of this package's pages, so
# the title below is what that list shows instead.
[docs.pages]
"README.md" = "Framing packets on a stream with no message boundaries"

[dependencies]
# Each part of the frame, as its own package.
#
# `leb128-nv` is `^0.1.1` rather than `^0.1.0` because the decoder calls
# `decode_at`, which answers a length prefix and the number of bytes it
# occupied in one call.  0.1.0 has no such call.  Every other range is
# the widest this package supports.  `varint-nv` requires `leb128-nv`
# too, at `^0.1.0`.  One version of a package is built into a program,
# and it is the highest release that satisfies both requirements.
cobs-nv   = "^0.1.0"
crc-nv    = "^0.1.0"
varint-nv = "^0.1.0"
leb128-nv = "^0.1.1"
